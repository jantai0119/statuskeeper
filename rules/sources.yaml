    notes: >-
      Replaces the HTML page https://www.cmu.edu/hub/calendar/index.html,
      which only links to files and states no dates. The webcal:// link on
      that page is this same URL over https. Because the feed is a rolling
      window, the watcher should diff by event (UID + date), not by file:
      events dropping off the past end are expected, not a rule change.
      Masters students in Heinz or Tepper follow different calendars, so the
      profile may eventually need a college field.

