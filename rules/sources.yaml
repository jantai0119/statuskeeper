      - "2026-08-27: SEVP broadcast (Aug 12 and Aug 24): CPT only when the internship is a graduation requirement for all students in the program; elective internships must use pre-completion OPT. OIE is updating its CPT page."
      - "2026-01-21: final H-1B rule (effective 2026-02-27) replaces the random lottery with a wage-level-weighted lottery; does not affect cap-exempt employers like CMU."
