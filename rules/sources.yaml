  - id: sevp-opt
    url: https://studyinthestates.dhs.gov/sevis-help-hub/student-records/fm-student-employment/f-1-optional-practical-training-opt
    title: F-1 Optional Practical Training (OPT)
    publisher: SEVP (DHS) — Study in the States, SEVIS Help Hub
    layer: federal
    school: null
    governs: [opt, cpt, h1b_cap_gap]
    page_last_updated: 2025-05-19
    last_checked:
    fetch: { status: ok, method: browser }
    observed:
      - "Audience is DSOs (school officials), not students."
      - "OPT eligibility: full-time student for one academic year; not in ESL; employment related to major; OPT at this level not exhausted; not authorized for 12+ months of full-time CPT."
      - "Full-time CPT at a previous school at the same program level counts toward the 12-month CPT total; CPT at another level does not."
      - "Twelve months of OPT per higher level of study."
      - "Post-completion OPT must be at least 20 hours per week or full-time."
      - "Form I-765 must be received by USCIS within 30 days of the DSO recommendation in SEVIS; after day 30 it is denied. Filing before the recommendation is also denied."
      - "An OPT request left in Requested status longer than 180 days is auto-cancelled by SEVIS."
      - "Post-completion OPT start date: on or after the program end date, and no more than 60 days after it."
      - "Post-completion OPT end date: no more than 12 months after the start date."
      - "Post-completion OPT unemployment: up to 90 days total; SEVP may terminate at 90."
      - "Student reports name/address/employer changes to the DSO within 10 days; DSO updates SEVIS within 21 days."
      - "Cap-gap: SEVIS auto-extends OPT if, on or after April 1, an employer files an eligible change-of-status H-1B petition with an October 1 start and the student's OPT ends on or after April 1."
    not_stated:
      - "The 90-days-before-program-end filing opening. That is on the USCIS I-765 page (uscis-i765)."
    notes: >-
      The cap-gap section still says "17-month OPT extension", a pre-2016
      term, so parts of this page are stale despite the 2025 update date.
      Prefer uscis-i765 for filing windows.

  - id: sevp-cpt
    url: https://studyinthestates.dhs.gov/sevis-help-hub/student-records/fm-student-employment/f-1-curricular-practical-training-cpt
    title: F-1 Curricular Practical Training (CPT)
    publisher: SEVP (DHS) — Study in the States, SEVIS Help Hub
    layer: federal
    school: null
    governs: [cpt]
    page_last_updated: 2026-08-24
    last_checked:
    fetch: { status: ok, method: browser }
    observed:
      - "Eligibility: lawfully enrolled full-time for at least a full academic year (exception for graduate programs that require earlier training); not in English language training; has secured a training position; practical training is integral to an established curriculum and directly related to the major."
      - "CPT occurs before the program end date on the I-20."
      - "CPT must be authorized in SEVIS before work begins; start date on or after the authorization date."
      - "Authorization is per employer and per period; concurrent authorizations are allowed with a separate authorization each."
      - "Full-time = more than 20 hours/week; part-time = 20 hours or less."
      - "Student must keep a full course of study while school is in session, even with CPT."
      - "One year of full-time CPT eliminates OPT eligibility."
      - "CPT authorization is only required for training inside the United States."
      - "DSOs can cancel CPT before its start date; after it, they can only shorten the end date."
      - "Refers DSOs to an August 2026 broadcast message on CPT guidance and a liability reminder."
    not_stated:
      - "The text of the August 2026 broadcast message. It is linked from this page but is not itself a monitored source (see candidates at the bottom)."
    notes: >-
      This is the federal floor for CPT. Keep it a separate rule from cmu-cpt.
      Schools decide what counts as curricular, the course requirement and
      their own deadlines, and those are stricter. DECISION (2026-09-25): the
      CPT rule uses the August 2026 SEVP standard. The internship must be a
      graduation requirement for every student in the program; elective
      internships do not qualify (they go through pre-completion OPT). That
      standard is currently evidenced via cmu-news, not by this page's own
      text. Promote the broadcast message (see candidates) to a monitored
      source.

