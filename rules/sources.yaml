      - "Visa expiry does not limit the stay while status is maintained."
      - "No new I-901 SEVIS fee when renewing on the same active SEVIS ID."
      - "Check consulate-specific wait times; administrative processing may delay return."
      - "An unexpired visa in an expired passport remains usable alongside the new passport."
    not_stated:
