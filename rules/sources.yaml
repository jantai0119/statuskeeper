# Monitored sources for the rule base.
#
# Every rule in rules/ must cite one of these sources. The (future) source
# watcher re-fetches each URL, diffs it against the last reviewed version, and
# opens a PR proposing rule edits. Nothing here is computed from; it is the
# evidence trail.
#
# Field reference
#   id                 stable slug; rule files reference sources by this id
#   url                the exact page monitored
#   title              page title as the page shows it
#   publisher          who issues the page
#   layer              federal | school
#   school             null for federal; school slug (e.g. cmu) for school layer
#   refines            school layer only: ids of federal sources this page narrows.
#                      Where a school rule is stricter, it wins for that school.
#   governs            topic tags (vocabulary below)
#   page_last_updated  the "last updated" date printed ON the page, if any.
#                      Blank = the page states none (all CMU pages), so the
#                      watcher must diff content, not trust a date.
#   last_checked       set only when a human has reviewed the page against the
#                      rules that cite it. Deliberately blank in this commit.
#   fetch              how the initial snapshot was obtained, and whether it worked
#   observed           what the page actually stated when fetched on observed_on,
#                      paraphrased. A snapshot for diffing, not a verified rule.
#   not_stated         things one might expect here that the page does NOT say
#   pending_changes    announced changes NOT in force. Never applied by the
#                      engine; display: watch means the UI shows it as a
#                      "watch" item, not as a rule or task.
#   status             omitted = usable; needs_verification = rules citing this
#                      source must stay unfinished until a human confirms it
#   recheck_next_scan  true = the page is known to be mid-rewrite; the next
#                      source scan must re-read it even if the diff looks small
#   notes              modelling guidance for rule authors
#
# Topic vocabulary (governs)
#   enrollment          full-time course load, reduced course load, online limits
#   i20_validity        I-20 end date, extensions
#   travel_signature    I-20 travel endorsement validity and how to obtain it
#   re_entry            documents needed to re-enter the U.S.
#   visa_stamp          visa sticker validity and renewal
#   passport            passport validity requirements
#   grace_period        time allowed after program/OPT end
#   on_campus_work      on-campus employment limits
#   cpt                 curricular practical training
#   opt                 post-completion OPT eligibility, filing, unemployment, reporting
#   stem_opt            24-month STEM OPT extension
#   h1b_cap_gap         H-1B cap calendar and cap-gap extension (employer-driven)
#   ssn                 Social Security Number eligibility
#   academic_calendar   term dates
#   rule_changes        announcements of changes to any of the above

