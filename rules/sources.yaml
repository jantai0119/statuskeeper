      endpoint: https://www.ecfr.gov/api/versioner/v1/full/2026-09-01/title-8.xml?part=214&section=214.2
      detail: >-
        The human URL redirects scripted clients to a bot-check page; the API
        endpoint above returns the same text and needs Accept-Encoding: gzip.
    observed:
      - "(f)(4): an F-1 student returning from a temporary absence of five months or less may be readmitted with a current I-20 properly endorsed by the DSO for reentry. The paragraph states no validity period for the endorsement."
      - "(f)(11)(i)(B)(2): post-completion OPT I-765 may be filed up to 90 days before the program end date and no later than 60 days after it, and within 30 days of the DSO's SEVIS recommendation."
      - "(f)(13)(ii): a student with an unexpired post-completion OPT EAD may return to resume employment with an I-20 endorsed for reentry within the last six months."
    pending_changes:
      - summary: >-
          eCFR's "current" text (from 2026-09-15) already incorporates the
          enjoined D/S final rule. Among other changes, (f)(11)(i)(B)(2) reads
          "no later than 30 days after" program end instead of 60. USCIS
