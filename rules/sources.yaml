  - id: cmu-h1b-cap-gap
    url: https://www.cmu.edu/oie/employment/f1-students/opt-stem-opt-extension/h1b-cap-gap-extension.html
    title: H-1B Cap Gap Extension
    publisher: CMU Office of International Education
    layer: school
    school: cmu
    refines: [sevp-opt]
    governs: [h1b_cap_gap, grace_period]
    page_last_updated:
    last_checked:
    status: needs_verification
    fetch: { status: ok, method: curl }
    observed:
      - "The fiscal year starts October 1; employers can file up to six months earlier (April 1)."
      - "CMU H-1B petitions are cap-exempt; cap-exempt petitions do not transfer to the private sector."
      - "Cap-gap precondition: as of April 1, on approved OPT or in the 60-day grace period, with a pending or approved change-of-status petition for an October 1 start, filed before OPT or grace ended."
      - "Consular-processing petitions do not qualify for cap-gap."
      - "Petition received before OPT expires: work authorization is extended. Received during the grace period: status is extended but no work is allowed."
      - "States an end date for the cap-gap I-20 extension. Deliberately NOT recorded here until verified against the current USCIS cap-gap guidance."
      - "Cap-gap I-20 is requested via MyOIE with the EAD and the I-797; OIE issues it within ten business days."
      - "90-day unemployment rule continues during automatic extension."
      - "Travel during cap-gap is possible only if the petition and change of status are approved, re-entry is before the H-1B start, and the student is otherwise admissible. H-1B entry is allowed at most ten days before October 1."
      - "Only the employer can give official updates on the petition."
    not_stated:
      - "The employer registration / lottery window or selection dates. No source in this file states the registration calendar."
    notes: >-
      Model H-1B as a calendar with preconditions, never as "apply by X".
      The student does not file. The employer registers and files, and the
      student's status on the filing date decides cap-gap eligibility.
      DECISION (2026-09-25): the cap-gap rule stays unfinished, with no end
      date, until the maintainer has checked the current USCIS cap-gap page.
      Do not fill it in from this page or from model knowledge.

