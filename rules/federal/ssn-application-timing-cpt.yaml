id: ssn-application-timing-cpt
title: When you can apply for an SSN on CPT
summary: >-
  If you need a Social Security Number for a CPT job, you can apply up to 30
  days before the CPT start date on your I-20. You only ever get one SSN; if
  you already have one, you don't apply again.
task: Apply for a Social Security Number
authority: federal
