id: ssn-application-timing-opt
title: When you can apply for an SSN on OPT
summary: >-
  If you need a Social Security Number for OPT work, you can apply up to 30
  days before the start date on your OPT card (EAD). You only ever get one
  SSN; if you already have one, you don't apply again.
task: Apply for a Social Security Number
authority: federal
school: null
