notes: >-
  Source: CMU OIE webinar, 2026-09-25 (3–5 months standard; ~30 business
  days premium, not counting mail).

  Conflict: CMU's written OPT page (cmu-opt-overview), fetched 2026-09-25,
  says authorization "can take one to two months". The two CMU sources
  disagree by a factor of about three. The authoritative figure is USCIS's
  own published processing times, which is not a monitored source yet; add
  it and resolve this before activating.

  Guidance only, on purpose: processing time is an estimate, so it must not
  become a computed date. The engine may later show it as a range next to
  the filing window.

  Premium processing fee amount deliberately not stated.
