id: opt-uscis-processing-time
title: How long USCIS takes to decide OPT and STEM OPT
summary: >-
  USCIS usually takes about 3 to 5 months to decide an OPT or STEM OPT
  application. Premium processing, for an extra fee, takes about 30 business
  days (around 6 weeks), plus mailing time. You cannot start working on OPT
  until the start date on the approved card.
