id: f1-startup-work-authorization
title: Starting a business needs work authorization
summary: >-
  Exploring a startup idea, such as market research, may be possible without
  work authorization. Once you take concrete action to advance it
  (registering the business, raising money, or pitching to investors), that
  counts as work and needs authorization like any other job. Your startup
  activity and titles may be reviewed in later visa or OPT applications, so
  keep your public profiles accurate.
task: Get work authorization before registering, fundraising or pitching
authority: federal
