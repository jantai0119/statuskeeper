notes: >-
  A flag, not a dated rule. Source: CMU OIE webinar, 2026-09-25. No monitored
  source states this; a federal source (e.g. SEVP guidance on
  entrepreneurship) is needed before it can be activated.

  Equity and share-holding have separate legal implications; the webinar
  recommended legal counsel. The app should link out, not advise.
