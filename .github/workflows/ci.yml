name: CI

on:
  push:
  pull_request:

# Read-only: CI checks code, it never writes to the repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Includes src/rules/rule-base.test.ts, which validates every file in
      # rules/. A rule edit that breaks the schema or a citation fails here.
      - name: Test
        run: npm test
